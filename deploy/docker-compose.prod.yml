services:
  app:
    image: ${APP_IMAGE}
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_DIR: "/data"
    volumes:
      - money_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  money_data:
    external: true
  caddy_data:
  caddy_config:
