<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2e24" />
    <title>Доступные деньги</title>
    <link rel="stylesheet" href="/style.css?v=5" />
  </head>
  <body>
    <div class="auth-screen" id="auth-screen" hidden>
      <div class="auth-card">
        <h1 class="auth-title">Доступные деньги</h1>
        <p class="auth-subtitle" id="auth-subtitle">Введите PIN-код для входа</p>
        <form id="auth-form" class="form" action="#" method="post" novalidate>
          <label class="field">
            <span>PIN-код или пароль</span>
            <input
              id="auth-pin"
              name="pin"
              type="password"
              inputmode="numeric"
              autocomplete="current-password"
              placeholder="••••"
              required
            />
          </label>
          <p class="error" id="auth-error" role="alert" aria-live="assertive" hidden></p>
          <button type="button" class="submit" id="auth-submit-btn">Войти</button>
        </form>
      </div>
    </div>

    <div class="app" id="app-main">
      <header class="hero">
        <div class="hero-top">
          <p class="brand">Доступно</p>
          <button type="button" class="logout-btn" id="logout-btn" title="Выйти" aria-label="Выйти">Выйти</button>
        </div>
        <p class="balance" id="balance" aria-live="polite">—</p>
        <p class="hint">после зарплат и трат</p>
        <div class="hero-badges">
          <div class="next-income-badge" id="next-income" aria-live="polite"></div>
          <div class="daily-budget-badge" id="daily-budget" aria-live="polite" hidden></div>
        </div>
      </header>

      <section class="debts-section" aria-labelledby="debts-heading">
        <div class="debts-section-head">
          <h2 id="debts-heading">Долги</h2>
          <p class="debt-total" id="debt-total" aria-live="polite">—</p>
        </div>

        <div id="debts-container"></div>
        <p class="empty" id="debts-empty" hidden>Пока нет долгов</p>

        <div class="add-debt-panel" id="add-debt-panel" hidden>
          <form id="add-debt-form" class="form" novalidate>
            <label class="field">
              <span>Название</span>
              <input
                id="new-debt-name"
                name="new-debt-name"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="кому или за что"
                required
              />
            </label>
            <label class="field">
              <span>Сумма долга</span>
              <input
                id="new-debt-amount"
                name="new-debt-amount"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                placeholder="необязательно"
              />
            </label>
            <p class="error" id="add-debt-error" hidden></p>
            <div class="add-debt-actions">
              <button type="button" class="ghost-btn" id="cancel-add-debt-btn">Отмена</button>
              <button type="submit" class="submit" id="add-debt-submit-btn">Сохранить</button>
            </div>
          </form>
        </div>

        <button type="button" class="add-debt-btn" id="add-debt-btn">+ Добавить долг</button>
      </section>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title" class="section-title">Доходы и траты</h2>
        <div class="tabs" role="tablist" aria-label="Тип операции">
          <button
            type="button"
            class="tab is-active"
            role="tab"
            id="tab-income"
            aria-selected="true"
            data-kind="income"
          >
            Поступило
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            id="tab-expense"
            aria-selected="false"
            data-kind="expense"
          >
            Потратил
          </button>
        </div>

        <form id="tx-form" class="form" novalidate>
          <label class="field">
            <span>Сумма</span>
            <input
              id="amount"
              name="amount"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              placeholder="1 000.00"
              required
            />
          </label>
          <label class="field">
            <span>Комментарий</span>
            <input
              id="note"
              name="note"
              type="text"
              maxlength="200"
              autocomplete="off"
              placeholder="необязательно"
            />
          </label>
          <p class="error" id="form-error" hidden></p>
          <button type="submit" class="submit" id="submit-btn">Сохранить</button>
        </form>
      </section>

      <section class="history" aria-labelledby="history-title">
        <div class="history-head">
          <h2 id="history-title">Последние операции</h2>
          <button type="button" class="clear-btn" id="clear-tx-btn">Очистить</button>
        </div>
        <ul class="list" id="tx-list"></ul>
        <p class="empty" id="empty-state" hidden>Пока нет операций</p>
      </section>
    </div>
    <script src="/app.js?v=5"></script>
  </body>
</html>
